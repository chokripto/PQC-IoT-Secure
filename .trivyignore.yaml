# Time-bounded exception for a stale package record inherited from the pinned
# Python base-image metadata. CI independently proves that the final runtime
# interpreter imports setuptools 84.2.1 before this scan runs.
vulnerabilities:
  - id: CVE-2025-47273
    purls:
      - "pkg:pypi/setuptools@70.3.0"
    expired_at: 2026-12-10
    statement: >-
      Trivy reports stale setuptools 70.3.0 metadata from the pinned base-image
      supply-chain record. The final runtime explicitly installs and verifies
      setuptools 84.2.1. Re-evaluate on base-image refresh or by 2026-12-10.
