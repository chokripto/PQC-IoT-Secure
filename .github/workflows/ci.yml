name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.4

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Audit locked Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.lock

  docker-integration:
    name: Docker integration and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned PQC image
        run: docker build --provenance=false --tag pqc-iot-secure:ci .

      - name: Verify non-root runtime
        run: test "$(docker run --rm pqc-iot-secure:ci id -u)" = "10001"

      - name: Verify remediated runtime packaging tools
        run: |
          docker run --rm --entrypoint /usr/local/bin/python pqc-iot-secure:ci -c \
            "import setuptools; assert setuptools.__version__ == '84.2.1'"

      - name: Run cryptographic test suite
        run: docker run --rm pqc-iot-secure:ci pytest -v

      - name: Generate benchmark evidence
        run: |
          docker run --name pqc-benchmark-ci pqc-iot-secure:ci \
            python -m scripts.benchmark_iot \
            --iterations 10 --warmup 2 \
            --output /tmp/benchmark.json
          docker cp pqc-benchmark-ci:/tmp/benchmark.json benchmark.json
          docker rm pqc-benchmark-ci

      - name: Upload benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pqc-benchmark-${{ github.sha }}
          path: benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          image: pqc-iot-secure:ci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-spdx-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Scan image for high-severity vulnerabilities
        uses: aquasecurity/trivy-action@b6643a29fecd7f34b3597bc6acb0a98b03d33ff8 # v0.33.1
        with:
          image-ref: pqc-iot-secure:ci
          format: json
          output: trivy-results.json
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln
          version: v0.76.2

      - name: Upload Trivy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.json
          if-no-files-found: error
          retention-days: 90

      - name: Run authenticated end-to-end exchange
        run: bash scripts/ci_integration.sh pqc-iot-secure:ci

      - name: Enforce HIGH and CRITICAL vulnerability gate
        run: |
          count="$(jq '[.Results[]?.Vulnerabilities[]?] | length' trivy-results.json)"
          if [ "$count" -ne 0 ]; then
            jq -r '.Results[]?.Vulnerabilities[]? |
              [.VulnerabilityID, .PkgName, .InstalledVersion, (.PkgIdentifier.PURL // "no-purl")] |
              @tsv' trivy-results.json
            exit 1
          fi
