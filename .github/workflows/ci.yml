name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-security:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile Python sources
        run: python -m compileall -q src scripts tests

      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.4

      - name: Run Ruff
        run: ruff check --output-format=github .

      - name: Audit Python dependencies
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: requirements.txt

  docker-integration:
    name: Docker cryptographic integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned PQC image
        run: docker build --tag pqc-iot-secure:ci .

      - name: Run cryptographic test suite
        run: docker run --rm pqc-iot-secure:ci pytest -v

      - name: Smoke-test reproducible benchmarks
        run: |
          docker run --rm pqc-iot-secure:ci \
            python -m scripts.benchmark_iot \
            --iterations 3 --warmup 1 \
            --output /tmp/benchmark.json

      - name: Run authenticated end-to-end exchange
        run: bash scripts/ci_integration.sh pqc-iot-secure:ci
