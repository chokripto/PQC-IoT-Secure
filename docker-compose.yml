services:
  server:
    build: .
    container_name: pqc_server
    command: ["python", "-m", "src.server.server_app"]
    environment:
      SERVER_IDENTITY_PUBLIC_KEY_FILE: /run/secrets/server_identity_public.key
      SERVER_IDENTITY_SECRET_KEY_FILE: /run/secrets/server_identity_secret.key
      DEVICE_REGISTRY_FILE: /run/secrets/device_registry.json
    volumes:
      - ./secrets/server_identity_public.key:/run/secrets/server_identity_public.key:ro
      - ./secrets/server_identity_secret.key:/run/secrets/server_identity_secret.key:ro
      - ./secrets/device_registry.json:/run/secrets/device_registry.json:ro
    ports:
      - "127.0.0.1:9000:9000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777

  device:
    build: .
    container_name: pqc_device
    depends_on:
      server:
        condition: service_healthy
    command: ["python", "-m", "src.device.device_client"]
    environment:
      PINNED_SERVER_IDENTITY_PUBLIC_KEY_FILE: /run/secrets/server_identity_public.key
      DEVICE_ID: device-001
      DEVICE_IDENTITY_PUBLIC_KEY_FILE: /run/secrets/device_identity_public.key
      DEVICE_IDENTITY_SECRET_KEY_FILE: /run/secrets/device_identity_secret.key
    volumes:
      - ./secrets/server_identity_public.key:/run/secrets/server_identity_public.key:ro
      - ./secrets/device-001/device_identity_public.key:/run/secrets/device_identity_public.key:ro
      - ./secrets/device-001/device_identity_secret.key:/run/secrets/device_identity_secret.key:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
